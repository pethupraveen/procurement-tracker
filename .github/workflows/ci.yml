# AUD-007: the repository had no workflows directory at all, so nothing checked
# a push and a change that broke the build or the role self-check could reach
# main unnoticed.
#
# This runs the two checks the project actually has, and nothing else. It does
# NOT deploy, and no workflow here should: deployment is Vercel's, connected to
# this repo directly, publishing main to production and every other branch to
# its own preview URL. A deploy workflow here would be a second path publishing
# the same app against the same database, and one of the two would go stale.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v7 on both: the v4 pair is built against Node 20, which the runners
      # now refuse to honour — they force those steps onto 24 and warn on
      # every run. That is the ACTION's own runtime, nothing to do with
      # node-version below, which is the Node this project's code runs on.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node 24 is what local development uses. Keep it in step with the
          # Node version Vercel builds with, or a green run here stops being
          # evidence about what ships.
          node-version: 24
          cache: npm

      # ci, not install: fails loudly if package-lock.json and package.json
      # have drifted apart, rather than quietly resolving something else.
      - run: npm ci

      # Both self-checks: the role permission rules (roles.js / rules.js) and
      # the master/child stage walk, which bundles App.jsx to drive the real
      # advance and move functions. `check` chains `check:stages`, so adding a
      # step for the latter here would only run it twice. Each prints which
      # module it cleared, so a red run still says where to look.
      - run: npm run check

      - run: npm run build
